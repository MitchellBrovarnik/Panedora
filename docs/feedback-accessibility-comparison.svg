<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-labelledby="title desc"><title id="title">Panedora feedback icons before and after</title><desc id="desc">Two rows compare thumbs up and thumbs down in inactive, current active outline, and updated active two-tone states.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1a0a2e"/><stop offset="1" stop-color="#0d1b3e"/></linearGradient></defs><rect width="720" height="342" rx="18" fill="#080810"/><rect x="8" y="8" width="704" height="326" rx="14" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#eceaf2"><text x="32" y="42" font-size="22" font-weight="700">Panedora · Feedback accessibility</text><text x="32" y="64" font-size="12" fill="#b6adca">Original SVG geometry · default color palette</text><text x="266" y="103" text-anchor="middle" font-size="14">Inactive</text><text x="444" y="103" text-anchor="middle" font-size="14">Current active</text><text x="622" y="103" text-anchor="middle" font-size="14" font-weight="600">Updated active</text><rect x="32" y="122" width="656" height="86" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".07"/><text x="52" y="170" font-size="15" fill="#e8e5ee" font-weight="600">Thumbs up</text><svg x="242" y="141" width="48" height="48" viewBox="0 0 24 24" stroke="#8d8799" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg><svg x="420" y="141" width="48" height="48" viewBox="0 0 24 24" stroke="#1db954" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg><svg x="598" y="141" width="48" height="48" viewBox="0 0 24 24" stroke="#1db954" fill="#11783b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg><rect x="32" y="230" width="656" height="86" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".07"/><text x="52" y="278" font-size="15" fill="#e8e5ee" font-weight="600">Thumbs down</text><svg x="242" y="249" width="48" height="48" viewBox="0 0 24 24" stroke="#8d8799" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2H7.28a2 2 0 0 0-2 1.7L3.9 12.7a2 2 0 0 0 2 2.3H10l-1 4a3 3 0 0 0 3 3l5-9"/><path d="M17 2v11h3a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2h-3z"/></svg><svg x="420" y="249" width="48" height="48" viewBox="0 0 24 24" stroke="#e81123" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2H7.28a2 2 0 0 0-2 1.7L3.9 12.7a2 2 0 0 0 2 2.3H10l-1 4a3 3 0 0 0 3 3l5-9"/><path d="M17 2v11h3a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2h-3z"/></svg><svg x="598" y="249" width="48" height="48" viewBox="0 0 24 24" stroke="#e81123" fill="#970b17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2H7.28a2 2 0 0 0-2 1.7L3.9 12.7a2 2 0 0 0 2 2.3H10l-1 4a3 3 0 0 0 3 3l5-9"/><path d="M17 2v11h3a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2h-3z"/></svg><text x="360" y="321" text-anchor="middle" font-size="12" fill="#b6adca">Inactive remains outlined. Active uses a darker fill and the original bright outline.</text></g></svg>
