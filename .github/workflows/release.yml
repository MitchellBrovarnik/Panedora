name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

# Creating a release with a new tag can emit both events. Serialize the
# entire pipeline so uploads for the same version cannot overlap.
concurrency:
  group: panedora-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync version from release tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        run: npm install

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            npm run prepare-dist
            cd dist
            npm install --omit=dev
            cd ..
            npx electron-builder --win --config electron-builder.config.js -p never

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            npm run prepare-dist
            cd dist
            npm install --omit=dev
            cd ..
            npx electron-builder --mac --config electron-builder.config.js -p never

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            sudo apt-get update
            sudo apt-get install -y libarchive-tools
            npm run prepare-dist
            cd dist
            npm install --omit=dev
            cd ..
            npx electron-builder --linux --config electron-builder.config.js -p never

      - name: Save release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panedora-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  release:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: panedora-*
          path: artifacts
          merge-multiple: true

      - name: Check existing release notes
        id: release-notes
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.payload.release?.tag_name || context.ref.replace(/^refs\/tags\//, '');
            let generate = true;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag
              });
              generate = !release.body?.trim();
            } catch (error) {
              // A new tag may not have a release yet. Other API failures must
              // fail the upload job instead of regenerating existing notes.
              if (error.status !== 404) throw error;
            }
            core.setOutput('generate', generate);

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: ${{ steps.release-notes.outputs.generate == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
